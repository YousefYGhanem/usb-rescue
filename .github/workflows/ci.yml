name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'   # weekly: catch a changed PhotoRec download or a broken runner image
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (parse, ASCII, PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1) {
            $errs = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "::error file=$($f.Name)::$_" }; exit 1 }
            # Windows PowerShell 5.1 reads BOM-less scripts as ANSI, so non-ASCII text would break.
            if ((Get-Content $f.FullName -Raw) -match '[^\x00-\x7F]') { Write-Host "::error file=$($f.Name)::non-ASCII character"; exit 1 }
          }
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { exit 1 }

  windows-e2e:
    name: Windows end-to-end (image, repair, mount)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - shell: powershell
        run: .\tests\windows-e2e.ps1

  photorec-download:
    name: PhotoRec download matches pinned SHA256
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pinned = [regex]::Match((Get-Content Recover-UsbDrive.ps1 -Raw), "\`$TestDiskSha256 = '([0-9A-F]*)'").Groups[1].Value
          Invoke-WebRequest 'https://www.cgsecurity.org/testdisk-7.2.win64.zip' -OutFile tdz.zip -UseBasicParsing
          $h = (Get-FileHash tdz.zip -Algorithm SHA256).Hash
          Write-Host "::notice::testdisk-7.2.win64.zip SHA256 $h ($((Get-Item tdz.zip).Length) bytes)"
          if (-not $pinned) { Write-Host '::warning::No SHA256 pinned in Recover-UsbDrive.ps1'; exit 0 }
          if ($h -ne $pinned) { Write-Host "::error::Download changed: got $h, pinned $pinned"; exit 1 }

  python-tests:
    name: Repair rules and two-pass imaging model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dosfstools exfatprogs ntfs-3g mtools
      - run: python3 tests/check_backups.py
      - run: python3 tests/check_two_pass.py
